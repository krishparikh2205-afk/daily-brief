name: Daily Update & Deploy to GitHub Pages

on:
  schedule:
    # 12:00 AM IST (Asia/Kolkata) = 18:30 UTC
    - cron: '30 18 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages and committing data
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Fetch Fresh Daily Data
        run: node scripts/fetch-all.mjs

      - name: Keepalive & Commit Daily Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Keepalive timestamp to prevent GitHub from disabling scheduled cron after 60 days of inactivity
          mkdir -p data
          date -u > data/keepalive.txt
          
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update daily brief: $(date -u +'%Y-%m-%d %H:%M UTC')" && git push)

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
