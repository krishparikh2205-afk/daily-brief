name: Daily Brief - Fetch & Deploy to Pages

on:
  schedule:
    # 18:30 UTC = 00:00 AM IST (Midnight Indian Standard Time)
    - cron: '30 18 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Execute Daily Data Ingestion Pipeline
        run: |
          echo "Executing data pipeline at $(date -u)"
          node scripts/fetch-all.mjs

      - name: Heartbeat Keepalive & Data Commit
        run: |
          # Keepalive: touch timestamp so GitHub never disables cron after 60 days
          date -u +"%Y-%m-%dT%H:%M:%SZ" > data/keepalive.txt
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes detected to commit."
          else
            git commit -m "chore(data): automated daily refresh [$(date -u +'%Y-%m-%d %H:%M UTC')] [skip ci]"
            git push origin main
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
